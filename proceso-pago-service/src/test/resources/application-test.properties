# Perfil "test" -- proceso-pago-service
spring.datasource.url=jdbc:h2:mem:proceso_pago_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# URLs de microservicios -- los RestTemplates están mockeados, valores no usados en test
app.services.carrito-compra-url=http://localhost:8082
app.services.registro-usuarios-url=http://localhost:8081
app.services.logistica-envios-url=http://localhost:8085

spring.application.name=proceso-pago-service-test