spring.application.name=logistica-envios-service

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/envio_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# URLs de otros microservicios (modo XAMPP / desarrollo local)
# registro-usuarios-service expone /api/usuarios en puerto 8081
microservicio.usuarios.url=http://localhost:8081
# pedido-service expone pedidos en puerto 8089
microservicio.pedidos.url=http://localhost:8089
# soporte-service expone notificaciones en puerto 8088
microservicio.soporte.url=http://localhost:8088
# analitica-service expone metricas en puerto 8084
microservicio.analitica.url=http://localhost:8084
