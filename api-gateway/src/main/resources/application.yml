server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    discovery:
      enabled: false
    gateway:
      routes:
        - id: registro-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/usuarios/**
          filters:
            - JwtAuthentication

        - id: carrito-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/carrito/**
          filters:
            - JwtAuthentication

        - id: envios-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/logistica-envios/**
          filters:
            - JwtAuthentication

        - id: analitica-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/analitica/**
          filters:
            - JwtAuthentication

        - id: pago-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/pagos/**
          filters:
            - JwtAuthentication

        - id: sesion-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/sesion/**

        - id: catalogo-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/catalogo/**
          filters:
            - JwtAuthentication

        - id: soporte-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/soporte/**
          filters:
            - JwtAuthentication

        - id: pedidos-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/pedidos/**
          filters:
            - JwtAuthentication

        - id: tiendas-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/tiendas/**,/api/tienda/**
          filters:
            - JwtAuthentication

        - id: inventario-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/inventario/**
          filters:
            - JwtAuthentication

        - id: catalogo-admin-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/catalogo-admin/**
          filters:
            - JwtAuthentication

        - id: estado-pedido-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/estado-pedido/**
          filters:
            - JwtAuthentication

        - id: metodo-pago-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/metodo-pago/**
          filters:
            - JwtAuthentication

        - id: estado-pago-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/estado-pago/**
          filters:
            - JwtAuthentication

        - id: estado-ticket-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/estado-ticket/**
          filters:
            - JwtAuthentication

        - id: categoria-ticket-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/categoria-ticket/**
          filters:
            - JwtAuthentication

        - id: canal-notificacion-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/canal-notificacion/**
          filters:
            - JwtAuthentication

        - id: resenas-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/resenas/**
          filters:
            - JwtAuthentication

        - id: notificaciones-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/notificaciones/**
          filters:
            - JwtAuthentication

        - id: mensajes-chat-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/mensajes-chat/**
          filters:
            - JwtAuthentication

        - id: respaldos-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/respaldos/**
          filters:
            - JwtAuthentication

        - id: reportes-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/reportes/**
          filters:
            - JwtAuthentication

        - id: metricas-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/metricas/**
          filters:
            - JwtAuthentication

        - id: alertas-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/alertas/**
          filters:
            - JwtAuthentication

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html
