server.port=8080
spring.application.name=api-gateway

# Disable discovery client to avoid SimpleDiscoveryClientAutoConfiguration errors
spring.cloud.discovery.enabled=false

# Routes configuration
spring.cloud.gateway.routes[0].id=registro-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.routes[1].id=carrito-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/carrito/**

spring.cloud.gateway.routes[2].id=envios-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
