spring.application.name=carrito-compra-service

server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/carrito_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# URLs de otros microservicios (modo XAMPP / desarrollo local)
app.services.registro-usuarios-url=http://localhost:8081
microservicio.catalogo.url=http://localhost:8087
microservicio.inventario.url=http://localhost:8087
microservicio.envios.url=http://localhost:8083
microservicio.pagos.url=http://localhost:8085