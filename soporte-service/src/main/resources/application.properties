spring.application.name=soporte-service

server.port=8088

spring.datasource.url=jdbc:mysql://localhost:3306/soporte_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# URLs de otros microservicios (modo XAMPP / desarrollo local)
# registro-usuarios-service expone /api/usuarios en puerto 8081
microservicio.usuarios.url=http://localhost:8081
# carrito-compra-service expone pedidos en puerto 8082
microservicio.pedidos.url=http://localhost:8082
# analitica-service expone metricas en puerto 8084
microservicio.analitica.url=http://localhost:8084
