name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - registro-usuarios-service
          - iniciosesion-service
          - carrito-compra-service
          - catalogo-inventario-service
          - gestion-tienda-service
          - pedido-service
          - proceso-pago-service
          - analica-service
          - soporte-service
          - logistica-envios-service
        include:
          - service: api-gateway
            java-version: 21
          - service: registro-usuarios-service
            java-version: 25
          - service: iniciosesion-service
            java-version: 25
          - service: carrito-compra-service
            java-version: 25
          - service: catalogo-inventario-service
            java-version: 25
          - service: gestion-tienda-service
            java-version: 25
          - service: pedido-service
            java-version: 25
          - service: proceso-pago-service
            java-version: 25
          - service: analica-service
            java-version: 25
          - service: soporte-service
            java-version: 25
          - service: logistica-envios-service
            java-version: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Run tests (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: mvn test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
